name: Backend Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [
      main,
      develop,
      feature/*,
      bugfix/*,
      hotfix/*
    ]


jobs:
  test-tools:
    runs-on: ubuntu-22.04
    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r backend/requirements.txt

    - name: Run module tests
      run: |
        python -m pytest tests/tools/ --timeout=30 --cov=backend/tools --cov-report=term --cov-report=html