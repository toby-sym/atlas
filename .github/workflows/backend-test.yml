name: Backend Tests

on:
  push:
    branches: [
      main,
      develop,
      feature/*,
      bugfix/*,
      hotfix/*
    ]

jobs:
  test-tools:
    runs-on: ubuntu-22.04
    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Check for requirements.txt
      run: |
        if [ -f requirements.txt ]; then
            echo "Found requirements.txt - installing dependencies"
        else
            echo "ERROR: requirements.txt not found in repository"
            echo "Please create a requirements.txt file with your Python dependencies"
            exit 1
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend\requirements.txt

    - name: Run module tests
      run: |
        python -m pytest tests/tools/ --timeout=30 --cov=backend/tools --cov-report=term --cov-report=html