name: Backend Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./backend

      - name: Check backend
        run: python -c "import main"
        working-directory: ./backend