name: Bump Atlas Version
run-name: Bump Atlas to ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New Atlas base version (X.Y.Z)"
        required: true
        default: "0.4.2"
        type: string

permissions:
  contents: write

concurrency:
  group: atlas-version-bump-main
  cancel-in-progress: false
  queue: max

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: echo "Run this workflow from main." && exit 1

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Atlas version metadata
        env:
          ATLAS_VERSION: ${{ inputs.version }}
        run: node scripts/bump-version.cjs "$ATLAS_VERSION"

      - name: Commit version update to main
        env:
          ATLAS_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Version.properties DESKTOP.md backend/main.py frontend/package.json frontend/package-lock.json frontend/src/App.jsx frontend/src/App.test.js src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore: bump Atlas version to $ATLAS_VERSION"
          git push origin HEAD:main
