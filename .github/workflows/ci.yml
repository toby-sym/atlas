name: Main CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-format:
    permissions:
      contents: write # Needed so the called workflow can auto-commit fixes
    uses: ./.github/workflows/pylint.yml

  backend-test:
    uses: ./.github/workflows/backend-test.yml

  frontend-test:
    uses: ./.github/workflows/frontend-test.yml

  version-test:
    uses: ./.github/workflows/version-test.yml

  dev-build:
    name: Dev build
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: [lint-and-format, backend-test, frontend-test, version-test]
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      build_type: dev
