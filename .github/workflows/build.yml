name: Build Pipeline
run-name: ${{ github.event_name == 'push' && format('release {0}', github.ref_name) || (inputs.build_type == 'release' && format('release {0}', inputs.tag_name || github.ref_name) || (inputs.build_type == 'beta' && format('beta {0}', inputs.tag_name || 'next') || 'dev')) }}

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      build_type:
        required: false
        type: string
      tag_name:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - release
          - beta
      tag_name:
        description: "Release tag, or beta base version (e.g. v0.2.0; beta defaults to Version.properties)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Serialize reservations, not the long platform builds. Each run gets one
    # counter, and all platforms consume the same pinned commit and version.
    concurrency:
      group: atlas-version-${{ inputs.build_type == 'beta' && 'beta' || github.run_id }}
      cancel-in-progress: false
      queue: max
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      version_script: ${{ steps.helper.outputs.script }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'beta' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve version and reserve beta counter
        id: version
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: node scripts/version.cjs prepare
      # Pass the helper as a job output so platform jobs can build old tags
      # without exposing this internal file in the run's downloadable artifacts.
      - name: Pass version helper to platform jobs
        id: helper
        run: |
          node -e 'const fs = require("node:fs"); const script = fs.readFileSync("scripts/version.cjs").toString("base64"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "script=" + script + String.fromCharCode(10));'

  windows:
    name: Windows
    needs: prepare
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      REACT_APP_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      REACT_APP_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore version helper
        env:
          VERSION_SCRIPT_BASE64: ${{ needs.prepare.outputs.version_script }}
        run: |
          node -e 'const fs = require("node:fs"); fs.mkdirSync(".atlas-build", { recursive: true }); fs.writeFileSync(".atlas-build/version.cjs", Buffer.from(process.env.VERSION_SCRIPT_BASE64, "base64"));'

      - name: Apply resolved app version
        run: node .atlas-build/version.cjs apply

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Test frontend and release metadata
        run: |
          npm --prefix frontend test -- --watchAll=false --runInBand
          node --test scripts/version.test.cjs

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python -m pytest tests/ --timeout=30 -q
          python scripts/build_backend.py

      - name: Smoke-test packaged backend with fake Ollama
        run: python scripts/smoke_backend.py src-tauri/binaries/atlas-backend-x86_64-pc-windows-msvc.exe

      - name: Test desktop connection port selection
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Windows installers
        run: npm run desktop:build

      - name: Upload dev artifacts
        if: needs.prepare.outputs.channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: windows-dev-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload release assets
        if: needs.prepare.outputs.channel != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos-arm64:
    name: MacOS (ARM64)
    needs: prepare
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      REACT_APP_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      REACT_APP_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Restore version helper
        env:
          VERSION_SCRIPT_BASE64: ${{ needs.prepare.outputs.version_script }}
        run: |
          node -e 'const fs = require("node:fs"); fs.mkdirSync(".atlas-build", { recursive: true }); fs.writeFileSync(".atlas-build/version.cjs", Buffer.from(process.env.VERSION_SCRIPT_BASE64, "base64"));'

      - name: Apply resolved app version
        run: node .atlas-build/version.cjs apply

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Test frontend and release metadata
        run: |
          npm --prefix frontend test -- --watchAll=false --runInBand
          node --test scripts/version.test.cjs

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python -m pytest tests/ --timeout=30 -q
          python scripts/build_backend.py

      - name: Smoke-test packaged backend with fake Ollama
        run: python scripts/smoke_backend.py src-tauri/binaries/atlas-backend-aarch64-apple-darwin

      - name: Test desktop connection port selection
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build macOS installer
        run: npm run desktop:build

      - name: Upload dev artifacts
        if: needs.prepare.outputs.channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-dev-build
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload release assets
        if: needs.prepare.outputs.channel != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos-aarch64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  macos-x86_64:
    name: MacOS (x86_64)
    needs: prepare
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      REACT_APP_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      REACT_APP_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Restore version helper
        env:
          VERSION_SCRIPT_BASE64: ${{ needs.prepare.outputs.version_script }}
        run: |
          node -e 'const fs = require("node:fs"); fs.mkdirSync(".atlas-build", { recursive: true }); fs.writeFileSync(".atlas-build/version.cjs", Buffer.from(process.env.VERSION_SCRIPT_BASE64, "base64"));'

      - name: Apply resolved app version
        run: node .atlas-build/version.cjs apply

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Test frontend and release metadata
        run: |
          npm --prefix frontend test -- --watchAll=false --runInBand
          node --test scripts/version.test.cjs

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python -m pytest tests/ --timeout=30 -q
          python scripts/build_backend.py

      - name: Smoke-test packaged backend with fake Ollama
        run: python scripts/smoke_backend.py src-tauri/binaries/atlas-backend-x86_64-apple-darwin

      - name: Test desktop connection port selection
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build macOS installer
        run: npm run desktop:build

      - name: Upload dev artifacts
        if: needs.prepare.outputs.channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-dev-build
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload release assets
        if: needs.prepare.outputs.channel != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos-x86_64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  linux:
    name: Linux
    needs: prepare
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      REACT_APP_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      REACT_APP_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Restore version helper
        env:
          VERSION_SCRIPT_BASE64: ${{ needs.prepare.outputs.version_script }}
        run: |
          node -e 'const fs = require("node:fs"); fs.mkdirSync(".atlas-build", { recursive: true }); fs.writeFileSync(".atlas-build/version.cjs", Buffer.from(process.env.VERSION_SCRIPT_BASE64, "base64"));'

      - name: Apply resolved app version
        run: node .atlas-build/version.cjs apply

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Test frontend and release metadata
        run: |
          npm --prefix frontend test -- --watchAll=false --runInBand
          node --test scripts/version.test.cjs

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python -m pytest tests/ --timeout=30 -q
          python scripts/build_backend.py

      - name: Smoke-test packaged backend with fake Ollama
        run: python scripts/smoke_backend.py src-tauri/binaries/atlas-backend-x86_64-unknown-linux-gnu

      - name: Test desktop connection port selection
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Linux installers
        # The sidecar was built and smoke-tested above. Limit Tauri to the two
        # shipped formats; "all" also builds an unused RPM (over 30 minutes).
        run: npx --no-install tauri build --bundles deb,appimage

      - name: Upload dev artifacts
        if: needs.prepare.outputs.channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: linux-dev-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload release assets
        if: needs.prepare.outputs.channel != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  publish:
    needs: [prepare, windows, macos-arm64, macos-x86_64, linux]
    if: needs.prepare.outputs.channel != 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish complete release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          name: Atlas ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.channel == 'beta' && 'false' || 'true' }}
          generate_release_notes: true
          files: release-assets/**/*
