name: Build Pipeline
run-name: ${{ github.event_name == 'push' && format('release {0}', github.ref_name) || (inputs.build_type == 'release' && format('release {0}', inputs.tag_name || github.ref_name) || 'dev') }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - release
      tag_name:
        description: "Release Tag (required if build_type is release)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set app version from tag
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$RAW_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${RAW_TAG#v}"
          else
            VERSION="0.0.0-${{ github.run_number }}"
          fi
          echo "Building version $VERSION"
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          "

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python scripts/build_backend.py

      - name: Build Windows installers
        run: npm run desktop:build

      - name: Upload dev artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: windows-dev-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish release assets
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest # Apple Silicon (aarch64)
            rust-target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel # Intel (x86_64)
            rust-target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Set app version from tag
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$RAW_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${RAW_TAG#v}"
          else
            VERSION="0.0.0-${{ github.run_number }}"
          fi
          echo "Building version $VERSION"
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          "

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python scripts/build_backend.py

      - name: Build macOS installer
        run: npm run desktop:build

      - name: Upload dev artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dev-build
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Publish release assets
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Set app version from tag
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$RAW_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${RAW_TAG#v}"
          else
            VERSION="0.0.0-${{ github.run_number }}"
          fi
          echo "Building version $VERSION"
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          "

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python scripts/build_backend.py

      - name: Build Linux installers
        run: npm run desktop:build

      - name: Upload dev artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: linux-dev-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Publish release assets
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage