name: Build Pipeline
run-name: ${{ github.event_name == 'push' && format('release {0}', github.ref_name) || (inputs.build_type == 'release' && format('release {0}', inputs.tag_name || github.ref_name) || (inputs.build_type == 'beta' && format('beta {0}', inputs.tag_name || 'next') || 'dev')) }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - release
          - beta
      tag_name:
        description: "Release tag, or beta base version (e.g. v0.2.0; beta defaults to Version.properties)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Serialize reservations, not the long platform builds. Each run gets one
    # counter, and all platforms consume the same pinned commit and version.
    concurrency:
      group: atlas-version-${{ inputs.build_type == 'beta' && 'beta' || github.run_id }}
      cancel-in-progress: false
      queue: max
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve version and reserve beta counter
        id: version
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: node scripts/version.cjs prepare
      # Keep the version helper available even when building an older release tag.
      - uses: actions/upload-artifact@v4
        with:
          name: build-version-script-${{ github.run_id }}
          path: scripts/version.cjs
          overwrite: true

  windows:
    needs: prepare
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      REACT_APP_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      REACT_APP_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/download-artifact@v4
        with:
          name: build-version-script-${{ github.run_id }}
          path: .atlas-build

      - name: Apply resolved app version
        run: node .atlas-build/version.cjs apply

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python scripts/build_backend.py

      - name: Build Windows installers
        run: npm run desktop:build

      - name: Upload dev artifacts
        if: needs.prepare.outputs.channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: windows-dev-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish release assets
        if: needs.prepare.outputs.channel != 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          name: Atlas ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.channel == 'beta' && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    needs: prepare
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      REACT_APP_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      REACT_APP_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
    strategy:
      matrix:
        include:
          - runner: macos-latest # Apple Silicon (aarch64)
            rust-target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel # Intel (x86_64)
            rust-target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: actions/download-artifact@v4
        with:
          name: build-version-script-${{ github.run_id }}
          path: .atlas-build

      - name: Apply resolved app version
        run: node .atlas-build/version.cjs apply

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python scripts/build_backend.py

      - name: Build macOS installer
        run: npm run desktop:build

      - name: Upload dev artifacts
        if: needs.prepare.outputs.channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dev-build
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Publish release assets
        if: needs.prepare.outputs.channel != 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          name: Atlas ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.channel == 'beta' && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg

  linux:
    needs: prepare
    env:
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
      REACT_APP_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      REACT_APP_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - uses: actions/download-artifact@v4
        with:
          name: build-version-script-${{ github.run_id }}
          path: .atlas-build

      - name: Apply resolved app version
        run: node .atlas-build/version.cjs apply

      - name: Install frontend and Tauri dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build backend sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python scripts/build_backend.py

      - name: Build Linux installers
        run: npm run desktop:build

      - name: Upload dev artifacts
        if: needs.prepare.outputs.channel == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: linux-dev-build
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Publish release assets
        if: needs.prepare.outputs.channel != 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          name: Atlas ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.channel == 'beta' && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
