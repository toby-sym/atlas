name: Build Version Tests
on:
  push:
    paths:
      - "Version.properties"
      - "scripts/version.cjs"
      - "scripts/version.test.cjs"
      - ".github/workflows/build.yml"
      - ".github/workflows/version-test.yml"
  pull_request:
    paths:
      - "Version.properties"
      - "scripts/version.cjs"
      - "scripts/version.test.cjs"
      - ".github/workflows/build.yml"
      - ".github/workflows/version-test.yml"
  workflow_dispatch:
jobs:
  version-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/version.test.cjs
